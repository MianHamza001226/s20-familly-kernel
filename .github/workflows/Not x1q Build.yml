
name: not x1q build_

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, Image, dtbs, or dtbo.img)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - Image
        - dtbs
        - dtbo.img

env:
  ARTIFACT_DIR: kernel_artifacts_${{ github.run_number }}

jobs:
  buildkernel:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            bc flex git ccache automake lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib python3-networkx libxml2-utils \
            bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool optipng libssl-dev python-is-python3 python3-virtualenv \
            llvm clang lld

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Create artifact directory
        run: |
          echo "Creating artifact directory: ${{ env.ARTIFACT_DIR }}"
          mkdir -p "${{ env.ARTIFACT_DIR }}" || {
            echo "Failed to create directory, trying with sudo..."
            sudo mkdir -p "${{ env.ARTIFACT_DIR }}" && sudo chown -R runner:runner "${{ env.ARTIFACT_DIR }}"
          }
          ls -la

      - name: Force SELinux enforcing in configs and DTS
        run: |
          set -e

          # 1) Enforce SELinux in defconfig(s)
          CONFIG_FILES=$(git ls-files \
            "arch/arm64/configs/vendor/x1q_defconfig" \
            "arch/arm64/configs/vendor/x1q*.config" \
            "arch/arm64/configs/*x1q*defconfig" || true)

          if [ -z "$CONFIG_FILES" ]; then
            echo "No x1q defconfig files found, attempt to use common vendor defconfig if present."
            CONFIG_FILES=$(git ls-files "arch/arm64/configs/vendor/*.defconfig" || true)
          fi

          for f in $CONFIG_FILES; do
            echo "Patching $f"
            # Ensure SELinux enabled
            grep -q '^CONFIG_SECURITY_SELINUX=' "$f" && \
              sed -i 's/^CONFIG_SECURITY_SELINUX=.*/CONFIG_SECURITY_SELINUX=y/' "$f" || \
              echo 'CONFIG_SECURITY_SELINUX=y' >> "$f"

            # Force bootparam enforcing (1=enforcing, 0=permissive)
            grep -q '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' "$f" && \
              sed -i 's/^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=.*/CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=1/' "$f" || \
              echo 'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=1' >> "$f"
          done

          # 2) Enforce via androidboot.selinux in DTS chosen bootargs (best-effort)
          DTS_FILES=$(git ls-files "arch/arm64/boot/dts/vendor/qcom/*x1q*.dtsi" "arch/arm64/boot/dts/vendor/qcom/*.dtsi" || true)
          for d in $DTS_FILES; do
            # If bootargs exists, set or replace androidboot.selinux to enforcing
            if grep -q 'bootargs' "$d"; then
              if grep -q 'androidboot.selinux=' "$d"; then
                sed -i 's/androidboot.selinux=\(permissive\|enforcing\)/androidboot.selinux=enforcing/g' "$d"
              else
                # Append enforcing to existing bootargs string
                sed -i 's/\(bootargs *= *"\)/\1androidboot.selinux=enforcing /' "$d"
              fi
              echo "Updated bootargs in $d"
              break
            fi
          done

      - name: Set permissions
        run: chmod +x x1q.sh

      - name: Build kernel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          sudo bash x1q.sh ${{ github.event.inputs.build_target }}

      - name: Verify enforcing in built config
        run: |
          if [ -f out/.config ]; then
            grep -E 'CONFIG_SECURITY_SELINUX=|CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' out/.config || true
          fi

      - name: Prepare artifacts
        run: |
          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
            cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: output_kernel
          path: AnyKernel3/*
